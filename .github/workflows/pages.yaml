name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: volta-cli/action@v5
      - uses: actions/configure-pages@v6
      - run: YARN_CHECKSUM_BEHAVIOR=ignore yarn install --immutable
      - run: yarn build
      - run: cp packages/app/routes-inventory.json packages/app/build/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/app/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
